---
# The connection mechanism (batch_connect.template: dcv) + set_host live in the
# scheduler's submit.yml.erb; cluster + desktop env come from the per-cluster file
# emitted by configure_cluster_for_ood.sh (ParallelCluster). `desktop` must be a
# form attribute so it lands in the batch-connect session context (the stock
# bc_desktop templates reference it to pick template/desktops/<desktop>.sh); it's
# hidden with a gnome default (the per-cluster `desktop:` merges over it, and the
# default also covers the PCS path, which sets no desktop attribute).
form:
  - desktop
  - session_timeout
attributes:
  desktop:
    widget: "hidden_field"
    value: "gnome"
  session_timeout:
    widget: select
    label: "Session timeout"
    help: "How long the desktop session may run before Slurm ends it."
    options:
      # Values are Slurm -t format: HH:MM:SS / D-HH:MM:SS.
      - [ "2 hours", "02:00:00" ]
      - [ "4 hours", "04:00:00" ]
      - [ "8 hours", "08:00:00" ]
      - [ "1 day",   "1-00:00:00" ]
